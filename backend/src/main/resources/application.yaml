spring:
  application:
    name: backend
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/booking
    username: booking
    password: ${BOOKING_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: booking-backend
            client-secret: ${BOOKING_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/booking/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/booking/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/booking/protocol/openid-connect/certs
            user-info-uri: http://localhost:8180/realms/booking/protocol/openid-connect/userinfo
            user-name-attribute: sub

management:
  endpoints:
    web:
      exposure:
        include: health

booking:
  rules:
    slot-minutes: 15
    open-time: "08:00"
    close-time: "20:00"
    max-duration: 4h
    max-days-ahead: 60

springdoc:
  swagger-ui:
    csrf:
      enabled: true